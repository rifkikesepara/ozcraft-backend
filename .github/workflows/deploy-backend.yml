name: CI/CD - Build, Push & Deploy ozcraft-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: rifkikesepara/ozcraft-backend

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME && format('{0}/ozcraft-backend', secrets.DOCKERHUB_USERNAME) || env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on Oracle Cloud Self-Hosted Runner
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Docker Image Name
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKER_USER" ]; then
            echo "IMAGE_NAME=${DOCKER_USER}/ozcraft-backend:latest" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV
          fi

      - name: Log in to Docker Hub on Runner
        continue-on-error: true
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          fi

      - name: Configure environment
        env:
          OLLAMA_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_BASE_URL || 'https://ollama.com/api' }}
        run: |
          set +x
          printf "IMAGE_NAME=%s\nPORT=5000\nOLLAMA_BASE_URL=%s\nOLLAMA_API_KEY=%s\nCORS_ORIGIN=https://rifkikesepara.github.io,https://ozcraft-oracle.rifkikesepara7.workers.dev,http://localhost:5173\n" \
            "$IMAGE_NAME" "$OLLAMA_URL" "$OLLAMA_KEY" > .env
          chmod 600 .env

      - name: Pull latest image
        run: docker compose pull

      - name: Run container via Docker Compose
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: docker compose up -d --remove-orphans
