services:
  ozcraft-backend:
    container_name: ozcraft-backend
    image: ${IMAGE_NAME:-rifkikesepara/ozcraft-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com/api}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://rifkikesepara.github.io,http://localhost:5173}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
